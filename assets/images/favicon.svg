<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" width="360" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Bonaventura Lab emblem</title>
  <desc id="desc">An elevated, dimensionally shaded navy letter B incorporating an organic dendritic neural branch illuminated by a cyan excitation light beam, and a glowing cyan photometry trace in the lower bowl.</desc>
  <defs>
    
    <linearGradient id="navyBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#224966" />
      <stop offset="50%" stop-color="#18344A" />
      <stop offset="100%" stop-color="#0E2030" />
    </linearGradient>

    
    <linearGradient id="navyRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A7A9C" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#234863" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#63B9D5" stop-opacity="0.35" />
    </linearGradient>

    
    <linearGradient id="lightBeam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#83C8D2" stop-opacity="0.0" />
      <stop offset="35%" stop-color="#8FE3E8" stop-opacity="0.55" />
      <stop offset="85%" stop-color="#A8F0F0" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.95" />
    </linearGradient>

    
    <linearGradient id="traceStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7EE8D2" />
      <stop offset="50%" stop-color="#56CFE1" />
      <stop offset="100%" stop-color="#48BFE3" />
    </linearGradient>

    
    <linearGradient id="traceFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#56CFE1" stop-opacity="0.42" />
      <stop offset="75%" stop-color="#7EE8D2" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#7EE8D2" stop-opacity="0.0" />
    </linearGradient>

    
    <linearGradient id="dendriteGrad" x1="0%" y1="100%" x2="85%" y2="0%">
      <stop offset="0%" stop-color="#7AD7E3" />
      <stop offset="28%" stop-color="#2A587A" />
      <stop offset="100%" stop-color="#142C3F" />
    </linearGradient>

    
    <filter id="emblemShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#0D1F2D" flood-opacity="0.16" />
    </filter>

    
    <filter id="cyanGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    
    <clipPath id="lowerBowlClip">
      <path d="M112 162 H205 C255 162 284 185 284 222 C284 260 250 282 188 282 H112 Z" />
    </clipPath>
  </defs>

  
  <g transform="translate(36, 4)">

    
    <g clip-path="url(#lowerBowlClip)">
      <path d="M108 228 H168
               C182 228 189 224 195 212
               C201 200 205 186 212 186
               C218 186 221 198 226 198
               C231 198 235 170 243 170
               C251 170 255 214 265 224
               C271 229 278 228 292 228
               L292 285 L108 285 Z" fill="url(#traceFill)" />
    </g>

    
    <g fill="none" stroke="url(#dendriteGrad)" stroke-linecap="round" stroke-linejoin="round">
      
      <path d="M102 126 C132 126 150 112 166 90" stroke-width="5.5" />
      
      
      <path d="M153 105 C148 84 140 68 128 53" stroke-width="3.6" />
      <path d="M144 82 C134 74 126 69 118 66" stroke-width="2.2" />
      <path d="M137 66 C137 56 140 48 145 41" stroke-width="2.0" />
      <path d="M128 53 L121 44 M128 53 L132 43" stroke-width="1.6" />

      
      <path d="M166 90 C177 73 190 59 208 46" stroke-width="4.0" />
      <path d="M179 74 C174 60 173 49 176 39" stroke-width="2.4" />
      <path d="M175 55 C168 49 163 45 157 42" stroke-width="1.7" />
      <path d="M192 59 C197 49 203 42 211 37" stroke-width="2.1" />
      <path d="M208 46 L219 39 M208 46 L221 48" stroke-width="1.8" />

      
      <path d="M166 90 C186 88 205 80 225 66" stroke-width="3.5" />
      <path d="M196 84 C206 75 215 66 222 57" stroke-width="2.1" />
      <path d="M210 75 C221 75 230 73 239 69" stroke-width="2.0" />
      <path d="M225 66 L236 59" stroke-width="1.6" />

      
      <path d="M159 98 C178 106 196 112 219 114" stroke-width="3.2" />
      <path d="M185 107 C196 101 206 96 218 93" stroke-width="2.1" />
      <path d="M202 112 C212 117 220 122 229 125" stroke-width="1.9" />
      <path d="M219 114 L232 112 M219 114 L229 120" stroke-width="1.6" />

      
      <path d="M142 116 C152 122 162 126 174 127" stroke-width="2.2" />
      <path d="M161 124 L170 131" stroke-width="1.5" />
    </g>

    
    <g filter="url(#emblemShadow)">
      
      <path d="M104 22 V286
               M104 22 H188
               C248 22 280 50 280 92
               C280 125 258 146 224 155
               C268 164 294 188 294 224
               C294 268 258 290 188 290
               H104" fill="none" stroke="url(#navyBody)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

      
      <path d="M104 22 V286
               M104 22 H188
               C248 22 280 50 280 92
               C280 125 258 146 224 155
               C268 164 294 188 294 224
               C294 268 258 290 188 290
               H104" fill="none" stroke="url(#navyRim)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    
    <g filter="url(#cyanGlow)">
      
      <path d="M-12 114 L106 121 L106 131 L-12 138 Z" fill="url(#lightBeam)" opacity="0.75" />
      
      <path d="M-4 126 H112" stroke="url(#lightBeam)" stroke-width="3.2" stroke-linecap="round" />
      
      <circle cx="106" cy="126" r="3.5" fill="#B8F7F7" opacity="0.9" />
    </g>

    
    <g filter="url(#cyanGlow)">
      <path d="M108 228 H168
               C182 228 189 224 195 212
               C201 200 205 186 212 186
               C218 186 221 198 226 198
               C231 198 235 170 243 170
               C251 170 255 214 265 224
               C271 229 278 228 291 228" fill="none" stroke="url(#traceStroke)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
      
      <path d="M112 228 H168
               C182 228 189 224 195 212
               C201 200 205 186 212 186
               C218 186 221 198 226 198
               C231 198 235 170 243 170
               C251 170 255 214 265 224
               C271 229 278 228 289 228" fill="none" stroke="#E0FCFF" stroke-width="1.4" opacity="0.8" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>