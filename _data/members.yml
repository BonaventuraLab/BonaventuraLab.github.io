members:
  - name: Jordi Bonaventura, PhD
    initials: JB
    role: Principal Investigator
    order: 1
    bio: I'm an Associate Professor at the University of Barcelona. My research is broadly focused on understanding how changes at the molecular, neurochemical, and pharmacological levels translate into changes in brain function and behavior. I'm particularly interested in the complexity of neurotransmitter systems, receptor pharmacology and brain circuitry, and in how these different pieces interact to shape what we do. Outside the lab I enjoy guitars, good food and trail running.
    orcid: https://orcid.org/0000-0002-4745-0151
