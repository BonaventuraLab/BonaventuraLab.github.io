  - name: Amelie Essmann
    initials: AE
    role: PhD Student
    order: 3
    bio: Amelie has a BSc in biology from Saint Peter’s University in Jersey City and a Master's in neuroscience with molecular neurobiology from Stockholm University. In the Bonaventura lab, she is doing her PhD, currently exploring the neural circuitry involved in chronic pain and the role of opioids. Amelie is mostly performing fiber photometry, opto- and chemogenetics to decipher neural circuitry. Outside the lab, Amelie enjoys doing sports and baking.
    orcid: https://orcid.org/0009-0008-9972-8187
    scholar:
