- title: Dopamine and opioid signaling
  description: We investigate interactions between dopamine and opioid systems, receptor pharmacology, and how neurochemical context shapes drug effects.
  image:
- title: Pain and affective states
  description: We study how pain and stress-related states influence neurotransmission, motivated behavior, and responses to pharmacological treatments.
  image:
- title: Neural circuits and motivated behavior
  description: We combine behavioral approaches with circuit-level tools to understand the neural mechanisms underlying reward, motivation, and behavioral adaptation.
  image:
- title: Neuroimaging and optical methods
  description: We use fiber photometry, fluorescent biosensors, optogenetic approaches, and PET imaging to investigate brain function across complementary scales.
