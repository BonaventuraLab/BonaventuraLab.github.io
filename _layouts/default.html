<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title == "Home" %}{{ site.title }}{% else %}{{ page.title }} | {{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.intro | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
     <a class="brand" href="{{ '/' | relative_url }}">
      <img class="site-logo"
       src="{{ '/assets/images/logo.svg' | relative_url }}"
       alt="Bonaventura Lab — University of Barcelona · UBNeuro">
    </a>
      <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">Menu</button>
      <nav class="site-nav" aria-label="Main navigation">
        {% for item in site.data.navigation %}
          <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="footer-inner">
      <div>
        <strong>Bonaventura Lab</strong>
        <p>University of Barcelona · IDIBELL · UBNeuro</p>
      </div>
      <div class="footer-links">
        <a href="{{ site.data.links.github }}">GitHub</a>
        {% if site.data.links.email %}<a href="mailto:{{ site.data.links.email }}">Email</a>{% endif %}
      </div>
      <p class="copyright">© {{ site.time | date: "%Y" }} Bonaventura Lab</p>
    </div>
  </footer>
  <script>
    const toggle = document.querySelector('.menu-toggle');
    const nav = document.querySelector('.site-nav');
    if (toggle && nav) {
      toggle.addEventListener('click', () => {
        const open = nav.classList.toggle('is-open');
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    }
  </script>
</body>
</html>
