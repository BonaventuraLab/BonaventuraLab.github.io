<section class="section section-tinted">
  <div class="section-title-row">
    <div>
      <p class="eyebrow">WHAT WE DO</p>
      <h2>Research</h2>
    </div>
    <a class="text-link" href="{{ '/research/' | relative_url }}">All research areas →</a>
  </div>

  <div
    class="research-grid"
    id="research-rotating-grid"
    data-total="{{ site.data.research | size }}"
    aria-live="polite"
  >
    {% for item in site.data.research %}
    <a
      class="research-card research-card--media{% if forloop.index > 3 %} is-hidden{% endif %}"
      href="{{ item.url | default: '/research/' | relative_url }}"
      data-index="{{ forloop.index0 }}"
    >
      {% if item.image %}
      <img
        class="research-card__bg"
        src="{{ item.image | relative_url }}"
        alt="{{ item.alt | default: item.title | escape }}"
        loading="lazy"
      >
      {% endif %}
      <div class="research-card__scrim" aria-hidden="true"></div>
      <div class="research-card__content">
        <div class="research-card__meta">
          <span class="card-number">0{{ forloop.index }}</span>
          <span class="research-card__arrow" aria-hidden="true">→</span>
        </div>
        <h3>{{ item.title }}</h3>
        <p>{{ item.description }}</p>
      </div>
    </a>
    {% endfor %}
  </div>
</section>

<style>
  .research-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1.25rem;
  }

  .research-card--media {
    position: relative;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    border-radius: 12px;
    display: flex;
    align-items: flex-end;
    padding: 1.5rem;
    color: #ffffff;
    background-color: #18344A;
    text-decoration: none;
    transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.35s ease;
  }

  .research-card--media.is-hidden {
    display: none;
  }

  .research-card--media.is-fading {
    opacity: 0.35;
  }

  .research-card--media:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 24px rgba(12, 27, 40, 0.18);
  }

  .research-card--media:focus-visible {
    outline: 3px solid #1E788A;
    outline-offset: 3px;
  }

  .research-card__bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.35s ease;
    z-index: 0;
  }

  .research-card--media:hover .research-card__bg {
    transform: scale(1.04);
  }

  .research-card__scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to top,
      rgba(12, 27, 40, 0.90) 0%,
      rgba(12, 27, 40, 0.55) 55%,
      rgba(12, 27, 40, 0.18) 100%
    );
    z-index: 1;
  }

  .research-card__content {
    position: relative;
    z-index: 2;
    width: 100%;
  }

  .research-card__meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.35rem;
  }

  .research-card--media .card-number {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #7AD1E2;
  }

  .research-card__arrow {
    font-size: 0.95rem;
    color: #7AD1E2;
    opacity: 0.75;
    transition: transform 0.25s ease, opacity 0.25s ease;
  }

  .research-card--media:hover .research-card__arrow {
    opacity: 1;
    transform: translateX(3px);
  }

  .research-card--media h3 {
    margin: 0 0 0.45rem;
    font-size: 1.2rem;
    line-height: 1.25;
    color: #ffffff;
  }

  .research-card--media p {
    margin: 0;
    font-size: 0.9rem;
    line-height: 1.45;
    color: rgba(255, 255, 255, 0.9);
  }

  @media (max-width: 900px) {
    .research-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 560px) {
    .research-grid {
      grid-template-columns: 1fr;
    }

    .research-card--media {
      aspect-ratio: 4 / 3;
    }
  }
</style>

<script>
  (function () {
    const grid = document.getElementById("research-rotating-grid");
    if (!grid) return;

    const cards = Array.from(grid.querySelectorAll(".research-card--media"));
    const visibleCount = 3;
    const intervalMs = 4500; // Change to adjust rotation speed (in ms)

    if (cards.length <= visibleCount) return;
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      return;
    }

    let startIndex = 0;
    let timer = null;

    function renderWindow() {
      const activeIndices = new Set();
      for (let i = 0; i < visibleCount; i++) {
        activeIndices.add((startIndex + i) % cards.length);
      }

      cards.forEach((card, idx) => {
        const shouldShow = activeIndices.has(idx);
        card.classList.toggle("is-hidden", !shouldShow);
      });

      // Reorder DOM nodes so visible cards sit cleanly in slots 1..3
      activeIndices.forEach((idx) => {
        grid.appendChild(cards[idx]);
      });
      cards.forEach((card, idx) => {
        if (!activeIndices.has(idx)) {
          grid.appendChild(card);
        }
      });
    }

    function rotateNext() {
      const currentlyVisible = cards.filter((c) => !c.classList.contains("is-hidden"));
      currentlyVisible.forEach((c) => c.classList.add("is-fading"));

      window.setTimeout(() => {
        startIndex = (startIndex + 1) % cards.length;
        renderWindow();
        const nextVisible = cards.filter((c) => !c.classList.contains("is-hidden"));
        nextVisible.forEach((c) => c.classList.remove("is-fading"));
      }, 200);
    }

    function startTimer() {
      stopTimer();
      timer = window.setInterval(rotateNext, intervalMs);
    }

    function stopTimer() {
      if (timer) {
        window.clearInterval(timer);
        timer = null;
      }
    }

    grid.addEventListener("mouseenter", stopTimer);
    grid.addEventListener("mouseleave", startTimer);
    grid.addEventListener("focusin", stopTimer);
    grid.addEventListener("focusout", startTimer);

    renderWindow();
    startTimer();
  })();
</script>
